<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Grabber</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <h1>Media Grabber</h1>
  <p class="subtitle">YouTube · Instagram · Facebook · X · TikTok</p>

  <form id="download-form">
    <label for="url">Video / post URL</label>
    <input type="url" id="url" placeholder="https://..." required>

    <div class="row">
      <div class="field">
        <label for="format">Format</label>
        <select id="format">
          <option value="mp3">MP3 (audio)</option>
          <option value="mp4">MP4 (video)</option>
        </select>
      </div>

      <div class="field">
        <label for="quality">Quality</label>
        <select id="quality">
          <option value="320">320 kbps</option>
          <option value="192">192 kbps</option>
          <option value="128">128 kbps</option>
        </select>
      </div>
    </div>

    <button type="submit" id="submit-btn">Download</button>
  </form>

  <div id="status-area" class="hidden">
    <p id="status-text">Starting…</p>
    <div class="progress-bar">
      <div id="progress-fill"></div>
    </div>
  </div>

  <div id="result-area" class="hidden">
    <p id="result-title"></p>
    <a id="result-link" class="button-link" href="#">Save file</a>
  </div>

  <p id="error-text" class="error hidden"></p>
</div>

<script src="script.js"></script>
</body>
</html>
